name: End-to-end tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the real image and run the tests against it
        env:
          SEED_KEY: ${{ secrets.SEED_KEY }}
        run: bash tests/e2e/run-docker.sh
