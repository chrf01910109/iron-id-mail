# IRON ID mail search: single-node OpenSearch on Railway's private network.
cluster.name: ironid-search
node.name: ironid-search-1
discovery.type: single-node
# HTTP (the engine connects here) listens on all addresses: "::" covers IPv6 and IPv4.
# Railway's private network is IPv6 in older environments. ironid-entrypoint.sh switches
# to 0.0.0.0 when the container has no IPv6.
http.host: "::"
http.port: 9200
# Node-to-node traffic: a single node never needs it outside the container.
transport.host: 127.0.0.1
path.data: /var/lib/ironid-search/data
bootstrap.memory_lock: false
# Only the engine's own indexes may be created implicitly (by a first write).
action.auto_create_index: "st_*"

# --- Security: password login over TLS, certificates generated by ironid-entrypoint.sh ---
plugins.security.ssl.transport.pemcert_filepath: certs/node.pem
plugins.security.ssl.transport.pemkey_filepath: certs/node-key.pem
plugins.security.ssl.transport.pemtrustedcas_filepath: certs/ca.pem
plugins.security.ssl.transport.enforce_hostname_verification: false
plugins.security.ssl.http.enabled: true
plugins.security.ssl.http.pemcert_filepath: certs/node.pem
plugins.security.ssl.http.pemkey_filepath: certs/node-key.pem
plugins.security.ssl.http.pemtrustedcas_filepath: certs/ca.pem
plugins.security.allow_default_init_securityindex: true
plugins.security.authcz.admin_dn: ["CN=ironid-search-admin,O=IRON ID"]
plugins.security.nodes_dn: ["CN=ironid-search-node,O=IRON ID"]
plugins.security.audit.type: noop
plugins.security.restapi.roles_enabled: []
plugins.security.system_indices.enabled: true
