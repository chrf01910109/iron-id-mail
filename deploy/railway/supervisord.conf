[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:postgresql]
command=/usr/lib/postgresql/16/bin/postgres -D /var/lib/postgresql/16/main -c config_file=/etc/postgresql/16/main/postgresql.conf
user=postgres
autostart=true
autorestart=true
stdout_logfile=/var/log/postgres.log
stderr_logfile=/var/log/postgres_err.log
priority=10

[program:seaweedfs]
command=/usr/local/bin/weed server -dir=/data/seaweed -s3 -s3.port=8333 -s3.allowEmptyFolder=true -ip=127.0.0.1
user=root
autostart=true
autorestart=true
stdout_logfile=/var/log/seaweedfs.log
stderr_logfile=/var/log/seaweedfs_err.log
priority=20

[program:ironid-engine]
command=/usr/local/bin/ironid-engine -c /opt/iron-id/config.json
user=root
autostart=true
autorestart=true
stdout_logfile=/var/log/ironid-engine.log
stderr_logfile=/var/log/ironid-engine_err.log
priority=30

[program:webmail]
command=/usr/bin/node /opt/iron-id/webmail/server.js
user=root
autostart=true
autorestart=true
directory=/opt/iron-id/webmail
environment=PORT="3001",NODE_ENV="production",IRONID_ENGINE_HOST="127.0.0.1",IRONID_ENGINE_PORT="8080"
stdout_logfile=/var/log/webmail.log
stderr_logfile=/var/log/webmail_err.log
priority=40
